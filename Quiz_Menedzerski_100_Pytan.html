<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz Menedżerski - 100 Pytań</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-3 sm:p-6">

  <div class="w-full max-w-lg mx-auto flex-1 flex flex-col justify-center my-auto">
    <!-- Kontener Główny -->
    <div id="quiz-card" class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col">
      
      <!-- Nagłówek i pasek postępu -->
      <div class="bg-slate-50 border-b border-slate-200 p-4">
        <div class="flex items-center justify-between text-xs sm:text-sm font-semibold text-slate-500 mb-2">
          <span id="category-badge" class="bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full text-xs truncate max-w-[220px]">Kategoria</span>
          <span id="score-counter">Wynik: 0</span>
        </div>
        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-blue-600 h-full transition-all duration-300" style="width: 1%"></div>
        </div>
        <div class="flex justify-between text-[11px] text-slate-400 mt-1.5 font-medium">
          <span id="question-progress">Pytanie 1 / 100</span>
          <span id="pct-badge">1%</span>
        </div>
      </div>

      <!-- Treść Pytania -->
      <div class="p-4 sm:p-6 flex-1 flex flex-col justify-center">
        <h2 id="question-text" class="text-base sm:text-lg font-bold text-slate-900 leading-snug min-h-[50px] flex items-center">
          Ładowanie pytania...
        </h2>

        <!-- Przyciski z odpowiedziami -->
        <div id="options-container" class="mt-5 space-y-2.5">
          <!-- Wstrzykiwane przez JS -->
        </div>

        <!-- Przycisk Dalej -->
        <div id="action-container" class="mt-5 pt-2 hidden">
          <button id="next-btn" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
            <span>Następne pytanie</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
          </button>
        </div>
      </div>

    </div>

    <!-- Ekran Końcowy -->
    <div id="result-card" class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-8 text-center hidden">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
        🏆
      </div>
      <h2 class="text-2xl font-bold text-slate-900 mb-1">Koniec testu!</h2>
      <p class="text-slate-500 text-sm mb-6">Ukończyłeś całe szkolenie testowe.</p>
      
      <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 mb-6">
        <div class="text-4xl font-extrabold text-blue-600" id="final-score">0 / 100</div>
        <div class="text-xs uppercase tracking-wider text-slate-400 font-bold mt-1" id="final-percentage">0% poprawnych</div>
      </div>

      <button onclick="restartQuiz()" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all">
        Rozwiąż ponownie (nowa kolejność)
      </button>
    </div>
  </div>

  <script>
    const rawQuestions = [{"question": "Jaki jest główny cel konstruktywnego feedbacku?", "options": ["Wyładowanie frustracji menedżera.", "Wskazanie obszarów do poprawy i wzmocnienie pożądanych zachowań.", "Udowodnienie pracownikowi, że nie ma racji.", "Zmuszenie pracownika do odejścia."], "correctAnswer": "Wskazanie obszarów do poprawy i wzmocnienie pożądanych zachowań.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Metoda FUKO (Fakty, Uczucia, Konsekwencje, Oczekiwania) służy do:", "options": ["Przeprowadzania rozmowy rekrutacyjnej.", "Udzielania profesjonalnej informacji zwrotnej.", "Delegowania zadań rutynowych.", "Zwalniania pracowników dyscyplinarnie."], "correctAnswer": "Udzielania profesjonalnej informacji zwrotnej.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Co jest najczęstszą barierą w skutecznym delegowaniu zadań?", "options": ["Nadmiar wolnego czasu u menedżera.", "Zbyt wysokie kompetencje zespołu.", "Przekonanie menedżera, że sam zrobi to szybciej i lepiej.", "Zbyt szczegółowe instrukcje."], "correctAnswer": "Przekonanie menedżera, że sam zrobi to szybciej i lepiej.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "W trakcie rozmowy dyscyplinującej należy skupić się na:", "options": ["Plotkach zasłyszanych w biurze.", "Osobowości i charakterze pracownika.", "Błędach innych pracowników z przeszłości.", "Zachowaniu pracownika, które łamie zasady."], "correctAnswer": "Zachowaniu pracownika, które łamie zasady.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Zarządzanie sytuacyjne (Blanchard) polega na:", "options": ["Delegowaniu 100% zadań na najbardziej doświadczonego pracownika.", "Dopasowaniu stylu zarządzania do poziomu dojrzałości pracownika w danym zadaniu.", "Zarządzaniu zawsze w taki sam, autorytarny sposób.", "Ignorowaniu problemów aż same znikną."], "correctAnswer": "Dopasowaniu stylu zarządzania do poziomu dojrzałości pracownika w danym zadaniu.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Gdy pracownik odmawia wykonania zadania, pierwszym krokiem menedżera powinno być:", "options": ["Przekazanie zadania komuś innemu bez słowa.", "Natychmiastowe zwolnienie z pracy.", "Nałożenie kary finansowej.", "Poznanie przyczyny odmowy."], "correctAnswer": "Poznanie przyczyny odmowy.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Skrót SMART w kontekście wyznaczania celów oznacza, że cel powinien być:", "options": ["Spontaniczny, Miły, Atrakcyjny, Rozrywkowy, Tajny.", "Szybki, Mocny, Ambitny, Rygorystyczny, Trudny.", "Sprecyzowany, Mierzalny, Akceptowalny, Realistyczny, Terminowy.", "Skomplikowany, Minimalny, Abstrakcyjny, Ryzykowny, Twórczy."], "correctAnswer": "Sprecyzowany, Mierzalny, Akceptowalny, Realistyczny, Terminowy.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Rozmowa oceniająca powinna opierać się na:", "options": ["Porównywaniu do najsłabszych członków zespołu.", "Wyłącznie na wynikach z ostatniego tygodnia.", "Wcześniej ustalonych i znanych kryteriach.", "Subiektywnym wrażeniu szefa w danym dniu."], "correctAnswer": "Wcześniej ustalonych i znanych kryteriach.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Efektywna pochwała to taka, która jest:", "options": ["Konkretna, odnosząca się do zachowania i szczera.", "Powiedziana na osobności, by inni nie zazdrościli.", "Udzielana tylko raz w roku.", "Ogólnikowa, np. 'dobra robota'."], "correctAnswer": "Konkretna, odnosząca się do zachowania i szczera.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Zjawisko 'mikrozarządzania' (micromanagement) najczęściej prowadzi do:", "options": ["Spadku motywacji i inicjatywy u podwładnych.", "Oszczędności czasu menedżera.", "Zbudowania ogromnego zaufania.", "Zwiększenia kreatywności zespołu."], "correctAnswer": "Spadku motywacji i inicjatywy u podwładnych.", "category": "Komunikacja i Efektywność Menedżerska (Feedback, Delegowanie)"}, {"question": "Aktywne słuchanie polega m.in. na:", "options": ["Przerywaniu, by od razu podać rozwiązanie.", "Planowaniu swojej riposty w trakcie wypowiedzi drugiej osoby.", "Parafrazowaniu, dopytywaniu i utrzymywaniu kontaktu wzrokowego.", "Skupieniu się na własnych myślach."], "correctAnswer": "Parafrazowaniu, dopytywaniu i utrzymywaniu kontaktu wzrokowego.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Asertywność to postawa charakteryzująca się:", "options": ["Stawianiem na swoim za wszelką cenę (agresja).", "Szacunkiem do własnych i cudzych praw i granic.", "Manipulowaniem rozmówcą dla własnych korzyści.", "Ustępowaniem dla świętego spokoju (uległość)."], "correctAnswer": "Szacunkiem do własnych i cudzych praw i granic.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Parafraza w komunikacji to:", "options": ["Powtórzenie własnymi słowami sensu wypowiedzi rozmówcy.", "Zmiana tematu rozmowy.", "Zignorowanie tego, co powiedział rozmówca.", "Dokładne, dosłowne zacytowanie rozmówcy."], "correctAnswer": "Powtórzenie własnymi słowami sensu wypowiedzi rozmówcy.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Komunikat 'Ty' najczęściej wywołuje u odbiorcy:", "options": ["Chęć natychmiastowej współpracy.", "Uznanie dla autorytetu nadawcy.", "Postawę obronną i opór.", "Poczucie bycia w pełni zrozumianym."], "correctAnswer": "Postawę obronną i opór.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Komunikat 'Ja' służy do:", "options": ["Egocentrycznego chwalenia się osiągnięciami.", "Wyrażania własnych uczuć i potrzeb bez oskarżania drugiej osoby.", "Podkreślania swojej wyższości nad rozmówcą.", "Rozkazywania bez użycia słowa 'proszę'."], "correctAnswer": "Wyrażania własnych uczuć i potrzeb bez oskarżania drugiej osoby.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Zniekształcenie poznawcze 'czytanie w myślach' polega na:", "options": ["Doskonałym rozumieniu potrzeb klienta.", "Aktywnym dopytywaniu o uczucia.", "Zakładaniu z góry, jakie intencje ma druga osoba, bez dowodów.", "Skutecznym przewidywaniu trendów rynkowych."], "correctAnswer": "Zakładaniu z góry, jakie intencje ma druga osoba, bez dowodów.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Najczęstszą przyczyną 'szumów komunikacyjnych' (nieporozumień) jest:", "options": ["Wysoka inteligencja emocjonalna rozmówców.", "Zbyt wolne tempo mówienia.", "Zbyt głośne mówienie.", "Różnica w interpretacji pojęć przez nadawcę i odbiorcę."], "correctAnswer": "Różnica w interpretacji pojęć przez nadawcę i odbiorcę.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Technika 'zdartej płyty' to technika asertywna polegająca na:", "options": ["Puszczaniu głośnej muzyki podczas kłótni.", "Zmienianiu zdania w nieskończoność.", "Ignorowaniu rozmówcy do skutku.", "Spokojnym, konsekwentnym powtarzaniu swojego stanowiska mimo prób manipulacji."], "correctAnswer": "Spokojnym, konsekwentnym powtarzaniu swojego stanowiska mimo prób manipulacji.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Otwarta postawa ciała (np. brak skrzyżowanych rąk) komunikuje zazwyczaj:", "options": ["Poczucie wyższości.", "Chęć szybkiego zakończenia rozmowy.", "Złość i ukrytą agresję.", "Gotowość do dialogu i brak nastawienia obronnego."], "correctAnswer": "Gotowość do dialogu i brak nastawienia obronnego.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Zadawanie pytań otwartych (np. 'Jak?', 'Dlaczego?', 'Co o tym myślisz?') ma na celu:", "options": ["Zakończenie dyskusji.", "Udowodnienie ignorancji rozmówcy.", "Wymuszenie krótkiej odpowiedzi 'tak' lub 'nie'.", "Zachęcenie rozmówcy do szerszej wypowiedzi i zebranie informacji."], "correctAnswer": "Zachęcenie rozmówcy do szerszej wypowiedzi i zebranie informacji.", "category": "Komunikacja Interpersonalna w Zespole (Słuchanie, Asertywność)"}, {"question": "Według Daniela Golemana, inteligencja emocjonalna (EQ) składa się m.in. z:", "options": ["Zdolności do ukrywania wszystkich swoich emocji.", "Tylko z umiejętności bycia miłym dla innych.", "Wysokiego IQ, zdolności matematycznych i pamięci absolutnej.", "Samoświadomości, samoregulacji, empatii, motywacji i umiejętności społecznych."], "correctAnswer": "Samoświadomości, samoregulacji, empatii, motywacji i umiejętności społecznych.", "category": "Inteligencja Emocjonalna i Rozwiązywanie Konfliktów"}, {"question": "Empatia poznawcza polega na:", "options": ["Wzbudzaniu u innych poczucia winy.", "Odczuwaniu dokładnie tego samego smutku, co druga osoba (zarażenie emocjonalne).", "Intelektualnym zrozumieniu perspektywy i sposobu myślenia innej osoby.", "Ignorowaniu logiki na rzecz uczuć."], "correctAnswer": "Intelektualnym zrozumieniu perspektywy i sposobu myślenia innej osoby.", "category": "Inteligencja Emocjonalna i Rozwiązywanie Konfliktów"}, {"question": "Samoregulacja w kontekście biznesowym oznacza:", "options": ["Zdolność do panowania nad własnymi impulsami i emocjami pod wpływem stresu.", "Odmowę odczuwania jakichkolwiek negatywnych emocji.", "Ślepe posłuszeństwo wobec przełożonych.", "Reagowanie krzykiem w sytuacjach kryzysowych."], "correctAnswer": "Zdolność do panowania nad własnymi impulsami i emocjami pod wpływem stresu.", "category": "Inteligencja Emocjonalna i Rozwiązywanie Konfliktów"}, {"question": "Gdy zespół wchodzi w fazę tzw. 'burzenia' (storming) wg modelu Tuckmana, głównym zadaniem lidera jest:", "options": ["Samodzielne     let questions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    // Tasowanie Fisher-Yates
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initQuiz() {
      // Tasowanie 100 pytań
      questions = shuffleArray(rawQuestions);
      currentIndex = 0;
      score = 0;
      answered = false;
      
      document.getElementById('quiz-card').classList.remove('hidden');
      document.getElementById('result-card').classList.add('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentIndex];
      
      // Postęp i kategoria
      document.getElementById('category-badge').textContent = q.category;
      document.getElementById('score-counter').textContent = 'Wynik: ' + score;
      document.getElementById('question-progress').textContent = 'Pytanie ' + (currentIndex + 1) + ' / ' + questions.length;
      
      const pct = Math.round(((currentIndex + 1) / questions.length) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('pct-badge').textContent = pct + '%';

      document.getElementById('question-text').textContent = q.question;
      document.getElementById('action-container').classList.add('hidden');

      // Tasowanie wariantów odpowiedzi dla danego pytania
      const shuffledOptions = shuffleArray(q.options);
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D'];
      shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 sm:p-4 rounded-xl border-2 border-slate-200 hover:border-blue-400 bg-white transition-all duration-150 flex items-start gap-3 active:scale-[0.99] cursor-pointer";
        btn.onclick = () => selectOption(btn, opt, q.correctAnswer);
        
        btn.innerHTML = `
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold shrink-0 mt-0.5">
            ${letters[idx]}
          </span>
          <span class="text-sm font-medium leading-snug flex-1">${opt}</span>
        `;
        container.appendChild(btn);
      });
    }

    function selectOption(btnElement, selectedOpt, correctOpt) {
      if (answered) return;
      answered = true;

      const allButtons = document.getElementById('options-container').querySelectorAll('button');
      
      if (selectedOpt === correctOpt) {
        score++;
        document.getElementById('score-counter').textContent = 'Wynik: ' + score;
        btnElement.classList.remove('border-slate-200', 'bg-white', 'hover:border-blue-400');
        btnElement.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-950');
      } else {
        btnElement.classList.remove('border-slate-200', 'bg-white', 'hover:border-blue-400');
        btnElement.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-950');
        
        // Wskaż poprawną
        allButtons.forEach(btn => {
          if (btn.innerText.includes(correctOpt)) {
            btn.classList.remove('border-slate-200', 'bg-white');
            btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-950');
          }
        });
      }

      // Zablokuj kursory
      allButtons.forEach(btn => btn.style.pointerEvents = 'none');
      document.getElementById('action-container').classList.remove('hidden');
    }

    document.getElementById('next-btn').onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResult();
      }
    };

    function showResult() {
      document.getElementById('quiz-card').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');
      document.getElementById('final-score').textContent = score + ' / ' + questions.length;
      document.getElementById('final-percentage').textContent = Math.round((score / questions.length) * 100) + '% poprawnych odpowiedzi';
    }

    function restartQuiz() {
      initQuiz();
    }

    // Start
    initQuiz();
  </script>
